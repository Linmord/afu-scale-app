name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install deps
        run: npm ci

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./app.json').expo.version")" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk AFU-v${{ steps.ver.outputs.version }}.apk

      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: AFU v${{ steps.ver.outputs.version }}
          body: |
            ## AFU 体脂秤 v${{ steps.ver.outputs.version }}

            适配 **AFU-WL-TZ-A1**（蚂蚁阿福沃莱 / ICOMON）体脂秤的本地优先 Android 应用。

            ### 安装
            下载下方 `AFU-v${{ steps.ver.outputs.version }}.apk` 安装即可（允许未知来源）。

            ### 首次使用
            1. 允许蓝牙/位置权限
            2. 轻踩秤唤醒 → 扫描添加（或手动输入 MAC）
            3. 赤脚站上秤测量 → 保存并选择分配单位
            4. 设置页配置电脑地址可同步数据（见 README）

            详见 [README](https://github.com/Linmord/afu-scale-app/blob/main/README.md)。
          draft: false
          prerelease: false
          files: AFU-v${{ steps.ver.outputs.version }}.apk
